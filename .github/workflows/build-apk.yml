name: Compilar Proyecto Universal

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Código Base
      uses: actions/checkout@v4

    - name: Configurar Entorno
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Empaquetar Aplicación
      run: |
        mkdir -p dist
        cp index.html style.css app.js config.json dist/
        cd dist && zip -r ../app-universal-release.zip ./*

    - name: Generar Artefacto Descargable
      uses: actions/upload-artifact@v4
      with:
        name: App-Release-Package
        path: app-universal-release.zip
